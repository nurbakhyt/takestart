name = "takestart"
compatibility_date = "2026-09-01"
workers_dev = false
compatibility_flags = ["nodejs_compat"]

# OpenNext output (generated by `pnpm build` via opennextjs-cloudflare)
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"

# Before first deploy:
#   1. pnpm wrangler d1 create takestart-db  (from apps/web)
#   2. paste the returned database_id below
#   3. pnpm wrangler r2 bucket create takestart-images
[[d1_databases]]
binding = "DB"
database_name = "takestart-db"
database_id = "493b0ffc-fa54-4c96-a4a7-8d99034a745a"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "SHOP_IMAGES"
bucket_name = "takestart-images"

# Наш AI-сервис (apps/ai): перевод названий ru/kk/en. У takestart-ai
# workers_dev = false, поэтому единственный вход — этот service binding.
[[services]]
binding = "AI_SERVICE"
service = "takestart-ai"

[observability.logs]
enabled = true
invocation_logs = true
